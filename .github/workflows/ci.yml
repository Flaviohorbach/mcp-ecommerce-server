name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Offline: a real MCP client against the real endpoint, with no network or API key.
      - run: npm test
      - run: npm run build:bin
      # The package must start and answer on stdio, exactly as npx would run it.
      - run: npm run test:package
      - run: npm run build
